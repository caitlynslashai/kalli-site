<svg xmlns="http://www.w3.org/2000/svg" viewBox="-115 -135 245 310" fill="none" stroke="#C0909C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <!-- Stem: curves down from center, slight rightward lean -->
  <path d="M0,0 C4,20 6,50 4,80 C2,100 -2,120 -4,140"/>

  <!-- Petal 1: tall upper, slight left lean -->
  <path d="M0,0 C-16,-30 -24,-74 -16,-102 C-12,-118 -5,-128 0,-134
           C5,-128 12,-116 12,-100 C16,-72 6,-28 0,0"/>

  <!-- Petal 2: upper-right -->
  <path d="M0,0 C6,-16 18,-40 34,-62 C42,-74 52,-84 60,-90
           C60,-80 50,-68 42,-56 C28,-36 12,-14 0,0"/>

  <!-- Petal 3: right, nearly horizontal -->
  <path d="M0,0 C10,-6 30,-14 56,-17 C72,-18 88,-13 96,-6
           C88,2 72,8 56,8 C30,7 10,5 0,0"/>

  <!-- Petal 4: lower-right -->
  <path d="M0,0 C10,8 22,24 30,46 C36,62 37,76 34,86
           C24,78 20,64 14,50 C6,28 2,10 0,0"/>

  <!-- Petal 5: lower-left, long dramatic sweep -->
  <path d="M0,0 C-6,16 -18,42 -32,72 C-42,94 -48,114 -46,128
           C-56,116 -56,94 -44,70 C-30,42 -12,16 0,0"/>

  <!-- Petal 6: left-lower sweep (widest, most dramatic) -->
  <path d="M0,0 C-10,10 -28,26 -52,46 C-70,62 -86,76 -94,84
           C-96,72 -80,56 -62,42 C-38,24 -14,8 0,0"/>

  <!-- Petal 7: left, angled slightly down -->
  <path d="M0,0 C-8,-2 -24,-8 -48,-14 C-64,-18 -80,-14 -90,-8
           C-82,0 -66,4 -50,6 C-26,8 -8,4 0,0"/>

  <!-- Stamens: 3 thin lines with filled dots -->
  <line x1="0" y1="0" x2="-12" y2="-32"/>
  <circle cx="-12" cy="-33" r="3.2" fill="#C0909C" stroke="none"/>

  <line x1="0" y1="0" x2="10" y2="-30"/>
  <circle cx="10" cy="-31" r="3.2" fill="#C0909C" stroke="none"/>

  <line x1="0" y1="0" x2="26" y2="-24"/>
  <circle cx="26" cy="-25" r="3.2" fill="#C0909C" stroke="none"/>

</svg>
