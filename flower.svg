<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 -135 240 285" fill="none" stroke="#C0909C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <!-- Petal 1: tall upper, slight left lean, narrow tip -->
  <path d="M0,0 C-16,-30 -24,-74 -16,-102 C-12,-118 -5,-128 0,-134
           C5,-128 12,-116 12,-100 C16,-72 6,-28 0,0"/>

  <!-- Petal 2: upper-right -->
  <path d="M0,0 C6,-16 18,-40 34,-62 C42,-74 52,-84 60,-90
           C60,-80 50,-68 42,-56 C28,-36 12,-14 0,0"/>

  <!-- Petal 3: right, nearly horizontal -->
  <path d="M0,0 C10,-6 30,-14 56,-17 C72,-18 88,-13 96,-6
           C88,2 72,8 56,8 C30,7 10,5 0,0"/>

  <!-- Petal 4: lower-right, shorter -->
  <path d="M0,0 C10,10 20,28 28,50 C34,66 35,80 32,90
           C22,82 18,68 12,52 C4,28 0,12 0,0"/>

  <!-- Petal 5: lower-left, large dramatic sweep -->
  <path d="M0,0 C-6,18 -18,44 -32,74 C-42,96 -48,116 -46,130
           C-56,118 -56,96 -44,72 C-30,44 -12,18 0,0"/>

  <!-- Petal 6: left-lower sweep (the widest, most dramatic) -->
  <path d="M0,0 C-10,10 -28,26 -52,46 C-70,62 -86,76 -94,86
           C-96,74 -80,58 -62,44 C-38,26 -14,8 0,0"/>

  <!-- Petal 7: left, angled slightly down -->
  <path d="M0,0 C-8,-2 -24,-8 -48,-14 C-64,-18 -80,-14 -90,-8
           C-82,0 -66,4 -50,6 C-26,8 -8,4 0,0"/>

  <!-- Stamens: 3 thin lines with small filled circles -->
  <line x1="0" y1="0" x2="-12" y2="-32"/>
  <circle cx="-12" cy="-33" r="3.2" fill="#C0909C" stroke="none"/>

  <line x1="0" y1="0" x2="10" y2="-30"/>
  <circle cx="10" cy="-31" r="3.2" fill="#C0909C" stroke="none"/>

  <line x1="0" y1="0" x2="26" y2="-24"/>
  <circle cx="26" cy="-25" r="3.2" fill="#C0909C" stroke="none"/>

</svg>
